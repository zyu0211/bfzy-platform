# ===================================================================
# 生产环境配置
# ===================================================================
spring:
  datasource:
    # 部署到有 MySQL 的服务器时，取消注释并使用真实连接信息
    # url: jdbc:mysql://localhost:3306/bfzy_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # username: bfzy
    # password: your_password
    # SQLite 降级兜底
    url: jdbc:sqlite:./data/bfzy-platform-prod.db
    driver-class-name: org.sqlite.JDBC

mybatis-plus:
  configuration:
    # 自定义 SQL 日志适配器，将所有 MyBatis 日志统一路由到 "SQL" logger
    log-impl: com.bfzy.platform.data.logging.SqlLogImpl
